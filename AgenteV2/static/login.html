<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Janas Agente · acesso</title>
<style>
  :root { color-scheme: dark; --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --text:#e6e8ee; --muted:#8b93a4; --accent:#6ea8fe; --bad:#f2777a; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:16px; }
  form { width:100%; max-width:360px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:28px; }
  h1 { margin:0 0 4px; font-size:20px; }
  p { margin:0 0 20px; color:var(--muted); font-size:14px; }
  input { width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button { margin-top:12px; width:100%; padding:11px; border:0; border-radius:9px; background:var(--accent); color:#0b1220; font:600 15px system-ui, sans-serif; cursor:pointer; }
  .erro { color:var(--bad); font-size:14px; margin-top:12px; min-height:1em; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Janas Agente</h1>
  <p>Digite o token de acesso mostrado no terminal do agente.</p>
  <input name="token" type="password" placeholder="token" autocomplete="current-password" autofocus required>
  <button type="submit">Entrar</button>
  <div class="erro">{{ERRO}}</div>
</form>
</body>
</html>
